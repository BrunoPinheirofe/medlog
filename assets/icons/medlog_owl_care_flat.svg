<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="1024" height="1024" fill="none">
  <!-- Rounded Squircle Background (Indigo 800 - App Theme) -->
  <rect width="256" height="256" rx="56" fill="#283593"/>

  <!-- Flat Geometric Owl Tilted Peeking from Bottom-Left -->
  <g transform="translate(128, 144) rotate(15) translate(-128, -144)">
    <!-- Owl Body Silhouette with Ear Tufts (Indigo 300) -->
    <path d="M56 72 C56 48 68 36 80 48 L96 64 H160 L176 48 C188 36 200 48 200 72 V192 C200 228 172 256 128 256 C84 256 56 228 56 192 Z" fill="#7986CB"/>

    <!-- Owl Belly Patch (Indigo 100) -->
