    <rect x="86" y="68" width="24" height="8" rx="4" fill="#1A237E"/>
    <rect x="146" y="68" width="24" height="8" rx="4" fill="#1A237E"/>

    <!-- Flat Geometric Beak (Warm Coral) -->
    <path d="M120 126 H136 L128 140 Z" fill="#FF5252"/>

    <!-- Care Heart at Chest (Warm Coral) -->
    <path d="M128 218 L98 188 C86 176 86 156 98 146 C110 136 122 144 128 154 C134 144 146 136 158 146 C170 156 170 176 158 188 Z" fill="#FF5252"/>

    <!-- Medical Cross Inside Heart (White) -->
