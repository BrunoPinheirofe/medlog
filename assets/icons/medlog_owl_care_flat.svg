    <!-- Flat Owl Wings Hugging the Heart (Indigo 400) -->
    <path d="M56 136 C78 136 98 154 98 176 C98 190 86 198 72 198 C58 198 56 184 56 168 Z" fill="#5C6BC0"/>
    <path d="M200 136 C178 136 158 154 158 176 C158 190 170 198 184 198 C198 198 200 184 200 168 Z" fill="#5C6BC0"/>
