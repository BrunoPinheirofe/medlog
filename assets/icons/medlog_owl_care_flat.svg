    <!-- Conjoined Flat Eyes (White) -->
    <circle cx="102" cy="108" r="28" fill="#FFFFFF"/>
    <circle cx="154" cy="108" r="28" fill="#FFFFFF"/>

    <!-- Pupils with Geometric Cutout Catchlight (Deep Indigo 900) -->
    <circle cx="104" cy="108" r="14" fill="#1A237E"/>
    <circle cx="110" cy="102" r="5" fill="#FFFFFF"/>
    <circle cx="152" cy="108" r="14" fill="#1A237E"/>
    <circle cx="158" cy="102" r="5" fill="#FFFFFF"/>

